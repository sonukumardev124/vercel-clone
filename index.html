<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>varcelClone</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <script src="style.js" defer></script>
</head>

<body>
    <main>
        <section>
            <nav>
                <div class="nav-left">
                    <div class="logo">
                        <i class="ri-triangle-fill"></i>
                    </div>
                    <div class="links-container">
                        <button>Products<i class="ri-arrow-down-s-line"></i></button>
                        <button>Resources<i class="ri-arrow-down-s-line"></i></button>
                        <button>Enterprise</button>
                        <button>Pricing</button>
                    </div>
                </div>
                <div class="nav-right">
                    <button class="btn-demo">Get a Demo</button>
                    <button class="login">Log In</button>
                    <button class="sign-up">Sign Up</button>
                </div>
                </div>
            </nav>
            <div class="hero-section">
                <div class="left">
                    <h1>Agentic Infrastructure</h1>
                    <div class="hero-button">
                        <button class="deploy">Deploy now</button>
                        <button class="sales">Talk to sales</button>
                    </div>
                </div>
                <div class="center">
                    <img src="image/fallback-dark-glow-mobile.avif" alt="">
                </div>
                <div class="right">
                    <span class="coding-agents" id="row1"><b id="boldText">For coding agents</b></span>
                    <span class="ship-apps" id="row2">To ship apps and agents</span>
                    <span class="automated-agents" id="row3">Automated by agents</span>
                </div>
            </div>
            <div class="company-logos">
                <img src="image/blackBox.png" alt="Blackbox AI Logo">
                <img src="image/Charles.png" alt="Charles Schwab Logo">
                <img src="image/Doordash.png" alt="DoorDash Logo">
                <img src="image/openAI.png" alt="OpenAI Logo">
                <img src="image/Supreme.png" alt="Supreme Logo">
                <img src="image/Wheather.png" alt="Weather Company Logo">
                <img src="image/Polymarket.png" alt="Polymarket Logo">
            </div>
        </section>
        <section class="section-2">
            <div class="section-2-title">
                <h1>Build agents on infrastructure that thinks like them</h1>
            </div>
            <div class="strategy-image">
                <img src="image/strategy desktop.webp" alt="strategy Image">
            </div>
        </section>
    </main>
</body>

</html>
